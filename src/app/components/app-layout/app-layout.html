<mat-toolbar color="primary" class="app-toolbar">
  <span class="brand">
    <mat-icon>assignment_turned_in</mat-icon>
    <span class="brand-text">Task Portfolio</span>
  </span>

  <span class="toolbar-spacer"></span>

  @if (authService.isAuthenticated()) {
    <nav class="nav-links">
      <a mat-button routerLink="/tasks" routerLinkActive="active-link">
        <mat-icon>task</mat-icon>
        Tasks
      </a>
      @if (authService.user()?.role === 'ADMIN') {
        <a mat-button routerLink="/audit-logs" routerLinkActive="active-link">
          <mat-icon>history</mat-icon>
          Audit Logs
        </a>
      }
    </nav>

    <span class="toolbar-spacer"></span>

    <span class="user-name">
      <mat-icon>account_circle</mat-icon>
      {{ authService.user()?.username }}
    </span>

    <button mat-icon-button (click)="logout()" aria-label="Logout">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<main class="main-content">
  <div class="container">
    <router-outlet></router-outlet>
  </div>
</main>
